<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Document Chatbot</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="app">
    <aside class="sidebar">
        <div class="sidebar-top">
            <h3>💬 Chat History</h3>
            <small class="muted">Recent chats & uploads</small>
        </div>
        <div id="chatList" class="chat-list">
            <!-- future: populate chat items here -->
            <div class="empty">No chats yet — upload a PDF to start</div>
        </div>
        <form id="uploadForm" class="upload-form" enctype="multipart/form-data">
            <label class="upload-label">Upload PDF</label>
            <input type="file" name="pdf" accept="application/pdf" required>
            <button type="submit" class="btn small">Upload</button>
            <p id="uploadStatus" class="upload-status"></p>
        </form>
    </aside>

    <main class="main">
        <header class="chat-header">
            <h2>📄 Document Based Chatbot</h2>
            <p class="muted">Ask questions about your uploaded documents</p>
        </header>

        <section class="chat-window">
            <div id="chatContainer" class="messages" role="log" aria-live="polite"></div>
            <div id="typingIndicator" class="typing" hidden>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
        </section>

        <form id="messageForm" class="message-form">
            <textarea id="question" placeholder="Ask anything about your uploaded document..." rows="1" autocomplete="off"></textarea>
            <button type="submit" id="sendBtn" aria-label="Send message" class="send-btn">
                <!-- simple send icon -->
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M22 2L11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
        </form>
    </main>
</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
